# megapowers model catalog: what orchestrates, what models exist, what each is for.
# Last reviewed: 2026-08-06 (model IDs age; scripts/check-freshness.sh guards this date).
# Edit an OVERRIDE LAYER, not this shipped file: a project .megapowers/models.toml or
# user ~/.config/megapowers/models.toml wins per key and survives plugin updates.
# Two identical copies ship (plugins/megapowers/models.toml and
# plugins/mega-orchestration/models.toml) because plugins cannot locate each other
# at runtime; scripts/validate.sh fails on any drift between them.
# Consumers: the megapowers SessionStart hook renders this into every session's
# context (hooks/render-model-catalog), and mega-orchestration's delegate-resolve
# reads it for lead, tiers, providers, and floor.
# Routing (roles, fallbacks, presets) stays in the multi-agent-delegation skill's
# delegates.toml. A provider section written in a delegates.toml layer wins over
# this catalog, but the session block renders from catalog layers only, so put
# provider data here.
#
# One model per provider per tier. Anything else is an override layer's business.
#   claude-opus-5     frontier: lead at high effort, hard design calls
#   claude-sonnet-5   strong: in-session teammate work and cheap execution
#   gpt-5.6-sol       frontier: plan review, code review, verify, judge, research
#   gpt-5.6-terra     strong: scoped implementation

# --- Legacy lead fallback ---
# delegate-resolve --lead prints it. Artifact reviews use --author-vendor rather
# than assuming the lead authored the artifact.
[lead]
provider = "claude"
tier     = "frontier"

# --- Tiers: the vendor-neutral capability scale, weakest first ---
[tiers]
scale = ["strong", "frontier"]

# What each tier is for. The session-start block teaches this to every session,
# including native subagent model choice.
[tiers.use]
strong   = "teammate work and cheap execution; the ship floor"
frontier = "lead, critic, judge, verify, hard design calls"

# --- Efforts: the vendor-neutral spend scale, weakest first ---
# The floor's effort half (tier:effort) and each provider's default `effort`
# speak this scale; a provider's `efforts` array lists the subset it accepts.
[efforts]
scale = ["low", "medium", "high", "xhigh", "max", "ultra"]

# These strings render into every session, and the block is clamped to 1024 bytes
# by hooks/render-model-catalog, so each one pays rent twice: in the clamp and in
# a cached prefix that costs more to churn than to leave alone. The xhigh entry
# carries its bar inline because that is the only place a session reads it.
[efforts.use]
low    = "mechanical steps, relays, latency-sensitive work"
medium = "balanced default: in-session teammate work, and delegated roles bounded by something other than depth (scoped impl, visual, browser)"
high   = "lead default, and every role that adjudicates or refutes"
xhigh  = "eval-gated; audit found 3x high usage without evidence"
max    = "unconstrained; eval-gated, never default"
ultra  = "deliberate complex work; Codex only, via the complex profile"

# --- Runtime adapters and model providers ---
# An adapter is the HARNESS launch surface. A provider is the model/vendor identity
# used for tiers and independence. `binary` is the CLI delegate-resolve
# probes with `command -v`, and that CLI brings its own stored login: this catalog
# holds no endpoints, keys, or token names, and adding them is out of scope by
# design. A model reachable only by hand-wiring a base URL and a token is not
# reachable here. `reference` names the channel-mechanics file, resolved relative to
# the multi-agent-delegation skill directory (the reference files ship with that
# skill). `use` is shown in the session block. Stop-hook approval reads a current
# structured receipt, never a transcript marker. Older override layers without
# [adapters] remain provider-keyed for compatibility.
[adapters.claude]
binary = "claude"
channel = "claude-cli"
reference = "references/providers/claude.md"

[adapters.codex]
binary = "codex"
channel = "native-or-plugin-or-mcp-or-cli"
reference = "references/providers/codex.md"

[adapters.opencode]
binary = "opencode"
channel = "opencode-native"
reference = "references/providers/opencode.md"

[providers.claude]
effort  = "high"   # lead default; in-session teammate work runs medium
efforts = ["low", "medium", "high", "xhigh", "max"]  # the CLI --effort scale has no `ultra` rung
vendor  = "anthropic"
adapter = "claude"
binary  = "claude"
channel = "claude-cli"
default_tier = "frontier"
capabilities = ["code", "vision", "computer_use"]
reference = "references/providers/claude.md"
use     = "lead: orchestration, integration, in-session teammate work"
notes   = "The lead runs as the session itself; the headless channel is for a delegate pass under a different lead."

# Two models, two tiers; the role's tier picks which. Sonnet 5 carries the strong
# tier so "least capable model that can do the role" has somewhere cheaper to land:
# Anthropic's 2026-07-24 guidance puts Sonnet 5 paired with a frontier advisor
# within 10 percent of frontier quality at 63 percent of the price. Effort is the
# other lever, and it crosses tiers: frontier at low effort can beat strong at
# high effort, so raise the tier before raising effort on hard work. Haiku is
# never routed.
[providers.claude.tiers]
frontier = "claude-opus-5"
strong   = "claude-sonnet-5"

# Second model vendor, so the cross-vendor roles have a real different-vendor route
# when the lead (or an --exclude) rules out the primary.
[providers.codex]
effort  = "high"   # default only where a role leaves effort unset; ultra is the complex profile only
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]  # max: model effort; ultra: complex profile
vendor  = "openai"
adapter = "codex"
binary  = "codex"
channel = "native-or-plugin-or-mcp-or-cli"
default_tier = "frontier"
capabilities = ["code", "vision", "computer_use"]
reference = "references/providers/codex.md"
use     = "critic: plan and code review, verify, judge, research, computer use, scoped impl"
notes   = "Native subagents inside Codex; codex-plugin-cc from Claude Code; codex exec / SDK / codex mcp-server elsewhere. Channel mechanics: see the reference file."

# sol reviews and researches; terra executes what the lead scoped for it.
[providers.codex.tiers]
frontier = "gpt-5.6-sol"
strong   = "gpt-5.6-terra"

# --- Defaults: cross-cutting rules ---
[defaults]
# Minimum tier:effort for anything that ships, on the global scales. A provider
# whose default_tier or declared default effort sits below the corresponding
# floor is skipped at resolution. Providers without an effort use the tier only.
# Wrapper agents relaying to an external CLI inherit the session model
# (`model: inherit`); relay fidelity is worth the spend.
floor = "strong:low"
