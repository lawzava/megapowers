# megapowers enforcement lifecycle: which rules block, which only advise, and
# what each blocking rule is allowed to look at.
# Last reviewed: 2026-08-06 (scripts/check-freshness.sh guards this date).
#
# Reasoning behind every narrowing below: hooks/risky-logic-gate.md. Read it
# before widening or removing one; each was earned by a measured false positive.
#
# EDIT AN OVERRIDE LAYER, NOT THIS FILE. A project .megapowers/enforcement.toml
# or user ~/.config/megapowers/enforcement.toml wins per key and survives plugin
# updates. `state = "off"` in a project layer is the supported per-repository
# opt-out.
#
# COMMIT that layer. A hook reads the project layer from the base commit, never
# from the pending tree, so a change cannot ship an exemption for itself. A
# pending edit is never honored and never silent: it is named in the block
# reason when something else blocks, and announced on its own otherwise, in both
# directions, so a human sees the moment policy moves. Only one hook announces a
# given fact: delegate-nudge announces any pending edit here, run-loop announces
# only an edit moving its own rule. The user layer is read from disk, because it
# sits outside the repository and reaches no diff.
#
# A layer has to be committable to be committed. A repository that gitignores
# `.megapowers/` has no base-commit copy and so no working opt-out at all; this
# repository's own .gitignore excludes the directory contents and re-includes
# this one file for that reason.
#
# States. A consumer reads any value other than its own as off, so a typo
# disables a rule rather than half-enabling it; check-enforcement.sh rejects
# unknown values for that reason.
#
#   off       does nothing. The supported per-repository opt-out.
#   advisory  stated where the model will see it, blocks nothing. Cheap,
#             reversible, measurable: scripts/session-metrics reports how often
#             an advisory rule is honored.
#   enforced  a hook blocks until satisfied. Reserve this for rules whose
#             violation is expensive and whose check is precise.
#
# Promote on measurement, not on conviction. A gate that fires on work it should
# not is a gate sessions learn to route around.

# --- The independent-review gate on risky logic ---
# An ACCIDENT BACKSTOP, not a security boundary, and it cannot become one:
# whoever writes the diff chooses the bytes the scanner reads. It makes
# forgetting expensive, not lying impossible. See hooks/risky-logic-gate.md.
[rules.risky-logic-review]
state    = "enforced"
hook     = "hooks/delegate-nudge.sh"
source   = "skills/cross-model-verification/SKILL.md"
promoted = "2026-07-06"

# The test that PROVES the declared state is the state that runs, by driving the
# hook with different declared states and asserting the behavior differs.
# check-enforcement.sh requires this linkage and deliberately does not try to
# reimplement the proof.
contract_test = "hooks/tests/delegate-nudge-scope.test.sh"

# Consecutive dispatches of one role on one branch that may end without an
# approve, before the gate hands the decision to the human. A reviewer that has
# not converged in three passes is not converging.
max_rounds = 3

# What the gate may read. Every narrowing is a rule about EXECUTABLE content,
# never about how important a path looks.
[rules.risky-logic-review.scope]

# The words that mean "this change can lose money, data, or a session".
keywords = ["authn", "authz", "authenticat", "authoriz", "oauth", "jwt", "saml", "passwd", "password", "billing", "payment", "invoice", "subscription", "stripe", "webhook", "mutex", "goroutine", "semaphore", "deadlock", "concurren"]

# Only lines the change ADDS can introduce risky logic.
added_lines_only = "true"

# A comment cannot authenticate a user or charge a card. Marker sets are chosen
# per extension; an unknown extension scans every line.
skip_comments = "true"

# Formats PROVEN not to execute. Excluded from the keyword scan, still shown to
# a reviewer when the gate fires for another reason. Tests, `*.txt`, `docs/*`,
# and `*.mdx` are deliberately absent. The hook scans an excluded path anyway
# when it is executable, shebanged, or unreadable.
exclude_globs = ["*.md", "*.rst", "LICENSE", "CHANGELOG.md"]

# The gate never scans the files that DEFINE it, or it blocks forever citing its
# own warning. Each path is ANCHORED against committed manifest facts, not
# matched by name. Add one only when the file's purpose is to define or exercise
# the gate; every addition is a real blind spot.
self_exclude = ["hooks/delegate-nudge.sh", "enforcement.toml", "skills/multi-agent-delegation/scripts/review-ack", "hooks/tests/delegate-nudge.test.sh", "hooks/tests/delegate-nudge-prose.test.sh", "hooks/tests/delegate-nudge-worktree.test.sh", "hooks/tests/delegate-nudge-untracked-cap.test.sh", "hooks/tests/delegate-nudge-scope.test.sh", "hooks/tests/delegate-nudge-evidence.test.sh", "scripts/tests/enforcement.test.sh", "scripts/tests/session-metrics.test.sh"]

# --- The autonomous-run continuation gate ---
# Listed so this file is a complete inventory of what can block a session.
[rules.autonomous-run-continuation]
state    = "enforced"
hook     = "hooks/run-loop.sh"
source   = "skills/autonomous-run/SKILL.md"
promoted = "2026-07-12"
contract_test = "hooks/tests/run-loop.test.sh"
