# megapowers enforcement lifecycle: which rules block, which only advise, and
# what each blocking rule is allowed to look at.
# Last reviewed: 2026-08-06 (scripts/check-freshness.sh guards this date).
#
# Edit an OVERRIDE LAYER, not this shipped file: a project .megapowers/enforcement.toml
# or user ~/.config/megapowers/enforcement.toml wins per key and survives plugin
# updates. Setting `state = "off"` in a project layer is the supported way to turn
# a gate off for one repository without patching a hook. COMMIT that layer: a hook
# reads the project layer as it stands in the base commit and never from the
# pending tree, so a change cannot ship an exemption for itself. A pending edit to
# the layer is never honored, and it is always said out loud: named in the block
# reason when something else blocks, and otherwise announced on its own as a
# non-blocking notice at any stop that would have been silent, including when the
# committed state is already `off`. Both directions are announced, loosening and
# tightening, because the point is that a human sees the moment policy moves. The
# user layer is read from disk, because it sits outside the repository and reaches
# no diff.
#
# The notice is per hook, and only ONE hook announces a given fact. delegate-nudge
# announces any pending edit to this file. run-loop announces only an edit that
# moves ITS own rule, because both hooks run at the same stop and two messages for
# one fact is the noise that gets a notice muted, which costs more than the
# duplication buys.
#
# The layer has to be committed, so it has to be committable. A repository that
# gitignores `.megapowers/` has no base-commit copy and therefore no working
# opt-out at all; this repository's own .gitignore excludes the directory contents
# and re-includes this one file for exactly that reason.
#
# Three states, and the promotion between them is the point:
#   off       the rule does nothing. This is the supported per-repository opt-out:
#             set it in a project layer rather than patching a hook.
#   advisory  the rule is stated where the model will see it and nothing blocks.
#             Cheap, reversible, and measurable: scripts/session-metrics reports
#             how often an advisory rule is honored.
#   enforced  a hook blocks until the rule is satisfied. Reserve this for rules
#             whose violation is expensive and whose check is precise, because a
#             gate that fires on work it should not is a gate sessions learn to
#             route around.
#
# A consumer reads any value other than its own state as off, so a typo disables
# a rule rather than half-enabling it. scripts/check-enforcement.sh rejects
# unknown values for exactly that reason.
#
# Promote on measurement, not on conviction, and measure the right thing. The
# audit behind this file (2026-08-05, 1324 Claude transcripts) found the enforced
# gate honored ~100% of the time at the cost of 141 blocks, 47 of which landed in
# a documentation repository. It also found the advisory router honored 100% of
# the time across 8 deliveries. Neither mechanism has a compliance problem: the
# gate has a precision problem and the router has a recall problem, which is why
# the work below is scoping the gate and broadening the router rather than making
# either one louder.

# --- The independent-review gate on risky logic ---
# Enforced since 2026-07-06. Owned by hooks/delegate-nudge.sh.
#
# WHAT THIS GATE IS, stated before the scope below, because the scope reads like
# a stronger promise than it can keep.
#
# It is an ACCIDENT BACKSTOP. It catches the ordinary case: someone changes auth,
# billing, or concurrency logic and ships it without asking for a second pair of
# eyes. That case is common, it is expensive, and a keyword scan over the pending
# diff catches it reliably.
#
# It is NOT a security boundary, and it cannot become one. Five rounds of
# adversarial review against this file's own hook found the same class of defect
# every round: a narrowing that trusted a NAME instead of proving a PROPERTY. The
# pending tree, a bounded byte sniff, a file extension, a comment marker, a
# directory name, a path in the index rather than the worktree. Each was real,
# each was fixed, and the next round found another. That is not a run of bad luck;
# it is what a heuristic over attacker-controlled input does. Whoever writes the
# diff chooses the bytes the scanner reads.
#
# So do not build anything on top of this that assumes evasion is hard. If a
# change must not ship unreviewed, the control is the review itself, in CI, on a
# branch nobody can push past. This gate makes forgetting expensive. It does not
# make lying impossible.
#
# The practical consequence for maintenance: a false NEGATIVE found here is worth
# fixing when it is reachable by accident, and worth writing down rather than
# chasing when it needs a crafted payload. A false POSITIVE is the failure that
# actually kills a gate, because a gate that fires on work it should not is one
# sessions learn to route around. The 2026-08-05 audit measured 141 blocks with
# 47 in a documentation repository, which is how this rule nearly died.
#
# Content this gate cannot read as text is ANNOUNCED, not blocked. A binary patch
# scanning as empty was a real hole, and it is closed by saying so out loud rather
# than by calling every unreadable file risky: for one round this gate treated
# them all as hits, and adding an image, an archive, an object file, a test
# fixture, or a generated report over the classification bound then cost a full
# cross-vendor review with no risky word and no risky path anywhere in the tree.
# That is the false positive this file names as the one that kills a gate. The
# path is the one signal such a file still leaves, so an unscannable path matching
# `keywords` blocks like any other finding. Everything else rides the block
# preamble when something else fires, and goes out as a non-blocking notice when
# nothing does. Not scanned is a fact; risky is a claim, and a claim needs
# evidence.
#
# A file the gate cannot OPEN takes the same route for the same reason. Unread and
# unreadable-as-text are different reasons the scan stopped, not different rules:
# the unreadable leg blocked outright for a round after the binary leg was
# corrected, so a mode-000 notes.md cost a full review with no risky word and no
# risky path. The readability test still runs ahead of the exclusion, because an
# exclusion is a claim about content the gate CAN read; what that position settles
# is whether the bytes were read, not whether they are risky.
[rules.risky-logic-review]
state    = "enforced"
hook     = "hooks/delegate-nudge.sh"
source   = "skills/cross-model-verification/SKILL.md"
promoted = "2026-07-06"

# The test that PROVES this rule's declared state is the state that runs, by
# driving the hook with different declared states and asserting the behavior
# differs. scripts/check-enforcement.sh requires this file to exist and to name
# the rule; it deliberately does not try to prove the behavior itself.
#
# That division is the point, and it was learned the hard way. The checker used
# to assert the guarantee directly by grepping the hook for this file's name.
# A comment satisfied it. Stripping comments first, an unused assignment
# satisfied it. Both times CI reported the guarantee as met while nothing
# honored the value, because a textual test cannot establish a behavioral
# property and text can always be shaped to pass. A behavioral test can, and one
# already exists per hook, so the checker's honest job is to insist the linkage
# is there rather than to reimplement the proof badly.
contract_test = "hooks/tests/delegate-nudge-scope.test.sh"

# Consecutive dispatches of one role on one branch that may end without an
# approve before the gate stops dispatching and hands the decision to the human.
# The round ledger already counted these; nothing capped them. The audit found a
# real branch that reached round 11 and a repository branch that reached round 22.
# A reviewer that has not converged in three passes is not converging: the next
# pass costs another full review and returns another needs_attention.
max_rounds = 3

# What the gate is permitted to read. Every narrowing here was earned by a
# measured false positive, and each one is stated as a rule about EXECUTABLE
# content, never about how important a path looks.
[rules.risky-logic-review.scope]

# The words that mean "this change can lose money, data, or a session".
# Unchanged from the original inline list; only WHERE it is matched moved.
keywords = ["authn", "authz", "authenticat", "authoriz", "oauth", "jwt", "saml", "passwd", "password", "billing", "payment", "invoice", "subscription", "stripe", "webhook", "mutex", "goroutine", "semaphore", "deadlock", "concurren"]

# Only lines the change ADDS can introduce risky logic. Context lines are the
# tree as it already stood, and removed lines are risk going away. Scanning all
# three made every edit near auth code read as an auth change.
added_lines_only = "true"

# A comment cannot authenticate a user or charge a card. Skipping comment lines
# is what stops prose ABOUT the gate from tripping the gate: the audit's single
# largest false-positive cluster was this repository's own hook source and docs
# citing the keyword list, 47 of 141 blocks.
#
# The marker set is chosen per file extension, because `#`, `--` and `;` open a
# comment in some languages and execute in others (`#define AUTHZ_DISABLED 1`,
# `--paymentAttempts`, `; paymentProcessor.charge()`). An extension the hook does
# not know scans every line, because the safe default when the language is
# unknown is to read the line rather than to trust a guess about its syntax.
#
# `*` is in no marker set at all. It opens nothing: it only CONTINUES a block
# comment, which a scanner reading one line at a time cannot know it is inside.
# Meanwhile it dereferences a pointer, multiplies, and starts a generator method
# in the very languages that set covers, so `*paymentTotal = 0` scanned clean.
# One false positive on a continuation line beats a missed dereference.
skip_comments = "true"

# Prose does not execute. A path matching any of these is excluded from the
# keyword scan; it is still shown to a reviewer when the gate fires for another
# reason, so nothing is hidden, only un-triggered.
#
# The test every entry has to pass: is this format PROVEN not to execute? Not
# "is this usually documentation", and never "is this path important". An
# exclusion bought with a path or a convenient extension is a blind spot with a
# reassuring name.
#
# Four exclusions that look obvious are deliberately absent, each one removed
# after it was shown to hide executable content.
# Tests: a test can carry real auth logic, and a security scan that skips the
# test tree is a scan with a known hole.
# `*.txt`: reads like prose and is not. requirements.txt is a dependency
# manifest, and a line adding an auth or payment library there is exactly the
# change this gate exists to catch.
# `docs/*`: a path, not a format. `docs/auth.ts`, a shell script, or a generated
# site's JavaScript all execute, and excluding the directory excluded all of them.
# `*.mdx`: MDX embeds JSX and JavaScript, so it is a source format wearing a
# documentation extension.
#
# The hook checks that claim per file rather than trusting the glob, and against
# the bytes that would actually ship. A path matching one of these is scanned
# anyway when it carries the executable mode bit, when its first line is a `#!`
# shebang, or when it cannot be read at all, because a file the kernel may run is
# not prose whatever it is called. Where the worktree copy cannot answer, because
# it is a fifo, a device, or a directory, the same two questions go to the STAGED
# copy: the index mode and the staged first two bytes are what a plain
# `git commit` ships. A worktree copy that cannot be read has proven nothing, and
# treating "I could not look" as "it is prose" is how an executable payload rode
# an excluded extension.
exclude_globs = ["*.md", "*.rst", "LICENSE", "CHANGELOG.md"]

# The gate never scans the files that DEFINE the gate. Editing the matcher is not
# shipping risky logic, and a rule whose own text matches itself blocks forever:
# the resulting review request cites its own warning as the risky change.
#
# Each path is ANCHORED, not suffix matched, and the anchor is PROVEN in both
# shapes. Under a prefix, the prefix must hold this plugin: the running
# installation when it lies inside the repository under review, or a prefix where
# the repository declares this plugin in COMMITTED content, as a
# .claude-plugin/plugin.json naming it. With no prefix left, the repository itself
# must be this plugin's: the running installation IS the repository root, or the
# root carries a committed .claude-plugin/plugin.json naming this plugin, or a
# committed root .claude-plugin/marketplace.json declares this plugin at a source
# prefix that proves out by that same manifest test. The last one is how the
# plugin's own source repository keeps the entries that carry no plugin prefix,
# such as scripts/tests/enforcement.test.sh, and it costs two committed facts
# rather than a name.
#
# A directory merely NAMED mega-orchestration anchors nothing, because a name is
# something anyone can spell. A root file merely NAMED enforcement.toml or
# hooks/delegate-nudge.sh anchors nothing for the same reason. A manifest or a
# marketplace the pending tree adds anchors nothing either, because a change must
# not mint its own exemption. An entry matching neither shape excludes nothing.
#
# The list is longer than "the hook" because a gate needs fixtures to be tested
# against, and a fixture for a keyword scan necessarily contains the keywords.
# Any repository whose subject matter IS this gate carries its own paths here;
# in an ordinary repository the first two entries are the whole list. Adding a
# path costs a real blind spot, so add one only when the file's purpose is to
# define or exercise the gate, never because a hit was inconvenient.
self_exclude = ["hooks/delegate-nudge.sh", "enforcement.toml", "hooks/tests/delegate-nudge.test.sh", "hooks/tests/delegate-nudge-prose.test.sh", "hooks/tests/delegate-nudge-worktree.test.sh", "hooks/tests/delegate-nudge-untracked-cap.test.sh", "hooks/tests/delegate-nudge-scope.test.sh", "scripts/tests/enforcement.test.sh", "scripts/tests/session-metrics.test.sh"]

# --- The autonomous-run continuation gate ---
# Enforced since 2026-07-12. Owned by hooks/run-loop.sh. Listed so the lifecycle
# file is a complete inventory of what can block a session, not a partial one.
[rules.autonomous-run-continuation]
state    = "enforced"
hook     = "hooks/run-loop.sh"
source   = "skills/autonomous-run/SKILL.md"
promoted = "2026-07-12"
contract_test = "hooks/tests/run-loop.test.sh"
