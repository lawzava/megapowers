# megapowers delegate routing: which provider handles which role, and run presets.
# Last reviewed: 2026-07-30 (routes age; scripts/check-freshness.sh guards this date).
# The model CATALOG (lead, tiers, providers, floor) lives in models.toml at the
# plugin root, layered the same way: project .megapowers/models.toml, then user
# ~/.config/megapowers/models.toml, then the shipped copy. Edit an override layer,
# not a shipped file. scripts/delegate-resolve resolves both files together, and
# a provider section written HERE wins over the catalog, but the session block
# renders from catalog layers only, so put provider data in models.toml.

# --- Requirements: capabilities a role's provider must declare ---
[requires]
visual        = ["computer_use"]
browser_test  = ["computer_use"]
visual_verify = ["vision"]

# --- Roles: which provider handles what ---
# Claude leads, so every role routes to Codex by default: the lead is the usual
# artifact author, and a review that stays in-vendor is not a second opinion.
# Visual/browser routing is a cost-adjusted call (bench check 2026-07-04, run
# against the then-current GPT-5.5; the route moved to gpt-5.6-sol on 2026-07-10
# without a re-bench). Codex leads computer-use work; visual_verify uses an
# independent vision model to judge evidence from the separate browser driver.
[roles]
plan_review    = "codex"     # review a plan before implementing
code_review    = "codex"     # review a diff
small_impl     = "codex"     # well-scoped, small-sized implementation
visual         = "codex"     # UI / visual work (native computer use)
browser_test   = "codex"     # browser / end-to-end testing
visual_verify  = "codex"     # vision model judges evidence captured by the separate Playwright driver
verify         = "codex"     # cross-model-verification: adversarial refute pass (must differ from the author's vendor)
judge          = "codex"     # best-of-n: blind judge when no oracle decides (prefer a vendor none of the authors used)
council_member = "codex"     # council-adjudication: independent answer + blind ranking member

# --- Fallbacks: ordered cross-vendor chains for the different-vendor roles ---
# delegate-resolve walks this chain and skips any provider named by
# --author-vendor or --exclude, disabled, or whose binary is not installed. The
# review roles carry chains so they resolve away from every artifact author;
# small_impl stays single-route
# (it is not an independence role).
#
# Order is deliberate: moonshot sits ahead of claude on every independence role so
# a chain that loses codex reaches a third vendor before it reaches the vendor that
# most often wrote the artifact. Chain length is not the same as reachable length:
# claude is the lead's vendor, so --author-vendor anthropic skips it, and moonshot
# ships with enabled false in the catalog, so it is skipped. Anthropic-authored
# work therefore still has exactly ONE reachable alternate (codex) until the
# moonshot channel is verified and enabled. Ordering it now means enabling the
# catalog entry is the only remaining step. visual_verify keeps its two-entry chain
# on purpose: moonshot does declare the vision capability that role requires, but
# judging screenshot evidence has not been benched on it, and an unbenched vision
# route is a worse second opinion than a benched one.
# What is still missing before moonshot can be enabled, and the channel mechanics:
# references/providers/moonshot.md.
[fallbacks]
plan_review    = ["codex", "moonshot", "claude"]
code_review    = ["codex", "moonshot", "claude"]
visual_verify  = ["codex", "claude"]
verify         = ["codex", "moonshot", "claude"]
judge          = ["codex", "moonshot", "claude"]
council_member = ["codex", "moonshot", "claude"]

# Role policy selects the model tier and reasoning effort. Provider defaults in
# the catalog cover the lead and anything a role leaves unset. Review and
# judgement run frontier; scoped implementation runs strong, which is cheaper and
# weaker by design. The tier names are vendor-neutral: which model each one means
# depends on the provider the chain lands on (on today's codex route, frontier is
# gpt-5.6-sol and strong is gpt-5.6-terra).
[role_tiers]
plan_review    = "frontier"
code_review    = "frontier"
small_impl     = "strong"
visual         = "frontier"
browser_test   = "frontier"
visual_verify  = "frontier"
verify         = "frontier"
judge          = "frontier"
council_member = "frontier"

[role_efforts]
plan_review    = "high"
code_review    = "high"
small_impl     = "high"
visual         = "high"
browser_test   = "high"
visual_verify  = "high"
verify         = "high"
judge          = "high"
council_member = "high"

# Independent roles must be resolved away from every artifact-author vendor.
# `--exclude-lead` remains a compatibility flag but does not satisfy this
# requirement because the catalog lead is not necessarily the artifact author.
[independence]
plan_review    = "author_vendor"
code_review    = "author_vendor"
visual_verify  = "author_vendor"
verify         = "author_vendor"
judge          = "all_author_vendors"
council_member = "author_vendor"

# Drivers gather evidence. They are not model providers and cannot satisfy a
# review role, vendor-independence claim, model tier, or ship floor.
[drivers.playwright]
binary       = "playwright-cli"
channel      = "playwright-cli"
capabilities = ["browser_driver"]
reference    = "references/providers/browser.md"

[role_drivers]
visual_verify = "playwright"

# --- Presets: how a delegate runs (resolve with `delegate-resolve --preset <name>`) ---
[presets.read_only]
sandbox  = "read-only"
approval = "never"
use      = "reviews & verification: the delegate looks and reports, it changes nothing"

[presets.build]
sandbox  = "workspace-write"
approval = "never"
worktree = "true"
use      = "small scoped impl; the lead runs the tests and integrates"

[presets.parallel]
sandbox  = "workspace-write"
approval = "never"
worktree = "true"
cap      = "3-5"
use      = "one worktree-isolated delegate per task; collect patches, integrate serially"

[presets.single_writer]
sandbox  = "workspace-write"
approval = "never"
worktree = "true"
use      = "delegates write only in worktrees or return patches; the lead owns integration and commits"
