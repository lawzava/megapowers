# megapowers delegate routing: which provider handles which role, and run presets.
# Last reviewed: 2026-08-10 (routes age; scripts/check-freshness.sh guards this date).
# The model CATALOG (lead, tiers, providers, floor) lives in models.toml at the
# plugin root, layered the same way: project .megapowers/models.toml, then user
# ~/.config/megapowers/models.toml, then the shipped copy. Edit an override layer,
# not a shipped file. scripts/delegate-resolve resolves both files together, and
# a provider section written HERE wins over the catalog, but the session block
# renders from catalog layers only, so put provider data in models.toml.

# --- Requirements: capabilities a role's provider must declare ---
[requires]
visual        = ["computer_use"]
browser_test  = ["computer_use"]
visual_verify = ["vision"]

# --- Roles: which provider handles what ---
# Two classes live here, and only one of them has a reason to leave the vendor.
#
# Independence roles route to Codex because a review that stays in-vendor is not a
# second opinion: same pretraining lineage, same alignment tuning, same blind spots.
# Those roles carry an [independence] entry below and resolve against the artifact's
# author, not against whoever the catalog calls the lead.
#
# small_impl defaults to `self`: the caller's own provider (--author-model /
# --author-vendor, else the catalog [lead]). A scoped implementation gains nothing
# from a different vendor, so spending a third-party call on it is waste. Such a
# route resolves with DISPATCH=native, meaning run it on the harness's own subagent
# or workflow surface; shelling out to your own CLI is the wrong instrument.
#
# `self` survived the 2026-08-09 eval on its independence argument, and it is now the
# one row with a live cost argument against it. The three implementation fixtures
# SATURATED: every frontier model passed every hidden test, including exactly-once
# execution under 24-way concurrency, crash-safe writes, and expiry driven by an
# injected clock. Quality did not separate anyone, so what is left is speed and
# spend, and there xai/grok-4.5 cleared all three in 6m05s for $0.61 against
# claude-sonnet-5's tier position. Routing small_impl at a cheap outside provider
# would be a cost decision, not an independence one, which is exactly the shape of
# the existing visual and browser_test rows. Left as `self` because changing it is a
# design call about who owns scoped writes, not a measurement question. The
# measurement is done and it says the cheaper route is good enough.
#
# visual and browser_test are the third case: they name a provider for capability
# and cost, not independence, so they DO leave the caller's vendor without an
# [independence] entry behind them. Do not read this table as "independence roles
# leave the vendor, everything else stays": read the row.
#
# Visual/browser routing is a cost-adjusted call (bench check 2026-07-04, run
# against the then-current GPT-5.5; the route moved to gpt-5.6-sol on 2026-07-10
# without a re-bench). Codex leads computer-use work; visual_verify uses an
# independent vision model to judge evidence from the separate browser driver.
[roles]
plan_review    = "codex"     # review a plan before implementing
code_review    = "codex"     # review a diff
small_impl     = "self"      # well-scoped, small-sized implementation: no independence requirement
visual         = "codex"     # UI / visual work (native computer use)
browser_test   = "codex"     # browser / end-to-end testing
visual_verify  = "codex"     # vision model judges evidence captured by the separate Playwright driver
verify         = "codex"     # cross-model-verification: adversarial refute pass (must differ from the author's vendor)
judge          = "codex"     # best-of-n: blind judge when no oracle decides (prefer a vendor none of the authors used)
council_member = "codex"     # council-adjudication: independent answer + blind ranking member

# --- Fallbacks: ordered cross-vendor chains for the different-vendor roles ---
# delegate-resolve walks this chain and skips any provider named by
# --author-vendor or --exclude, disabled, or whose binary is not installed. The
# review roles carry chains so they resolve away from every artifact author.
# small_impl has no chain because `self` has nowhere to fall back TO: the caller's
# own provider or no route. It is not an independence role, so a chain would only
# smuggle a third-party call into work that never needed one.
#
# Chain length is not the same as reachable length. Claude is the lead's vendor, so
# --author-vendor anthropic skips it; until 2026-08-10 that left anthropic-authored
# work exactly ONE reachable alternate and independence was single-route. It is now
# four (codex, qwen, moonshot, deepseek), so a single vendor outage no longer takes
# cross-vendor review with it. ALTERNATES on a resolved independence route is still
# the number to watch, and `<role> --vendors` printing fewer than two still says the
# same thing before dispatch; the difference is that the healthy number is no longer
# uncomfortably close to the failing one.
#
# Reachable still means installed. All four alternates resolve through two binaries,
# `codex` and `opencode`, so a box with neither is back to ALTERNATES=0 no matter how
# long this chain reads. Count binaries, not rows.
#
# What survives an outage of all of them is context separation, the half with a
# controlled result behind it: `delegate-resolve --allow-context-separation` falls
# back to a fresh same-vendor session, labeled INDEPENDENCE=context-separation and
# recorded as independent=false. That keeps ordinary review happening while leaving
# the risky-logic gate refusing anything but a real cross-vendor pass. It is a
# narrower claim, not a replacement.
#
# RESOLVED 2026-08-10: the third vendor landed, and so did a fourth and a fifth.
# The rule that kept them out is unchanged and is what let them in: a provider earns
# a row by being a harness someone runs, not by being a model with an endpoint. The
# harness is opencode, which holds its own stored login exactly as the claude and
# codex CLIs do. megapowers still wires no base URL and no token. A hosted model
# reached only by pointing a base URL at somebody else's compatible proxy still does
# NOT qualify, because that borrows a scaffold rather than bringing one.
#
# qwen, moonshot and deepseek now carry rows in models.toml, so anthropic-authored
# work resolves to ALTERNATES=4 rather than 1 and the next codex outage no longer
# takes cross-vendor review with it. `--allow-context-separation` stays as the
# degraded path, but it should now be rare enough to be a smell.
#
# The acceptance bar was a repo role eval, and it ran: fifteen models over two
# code-review fixtures carrying thirteen planted defects between them, plus three
# implementation tasks with hidden tests. Recall out of 13: opus-5 13, qwen3.8-max
# 13, kimi-k3 13, deepseek-v4-pro 12, gpt-5.6-sol 12, grok-4.5 11. Every routed
# model cleared the ship floor. Two results are load-bearing beyond the ranking:
#   - Harness moved scores more than model choice or reasoning effort did. sol hung
#     on three of four opencode runs and ran clean on codex; opus ran 3x faster in
#     Claude Code than in opencode at identical recall. Meanwhile raising effort to
#     xhigh changed one model of four measurably, and kimi-k3 ignored the flag
#     entirely. Pin the channel before reaching for a bigger model or more effort.
#   - The effect does not generalise across vendors. Running the opencode-hosted
#     four inside codex measured WORSE (kimi-k3 13 to 11, deepseek-v4-pro 12 to 9,
#     qwen3.8-max flat but 2.6x slower). A native harness helps the model it was
#     co-trained with and hurts a third-party model pushed through a rival's.
#
# The acceptance bar that gated K3 on 2026-08-09 is worth re-applying to the next
# candidate, so here is how it closed. Throughput and capacity cleared: 185 to 238s
# per review, no 429s across thirty-plus runs. Verbosity held, and turned out to be
# a feature: k3 consistently lists what it checked and cleared, which shortens the
# audit rather than lengthening it. Session fragility was never exercised, because
# these are one-shot read-only reviews that do not switch models mid-session, and
# the adapter must keep it that way. Moonshot's own Kimi Code CLI would still be a
# better home than opencode if someone installs it; that is now an upgrade to an
# existing row rather than a blocker on a missing one.
#
# Caveat carried forward: n=1 per cell and two fixtures. Building the SECOND fixture
# reversed the ranking for grok-4.5 and glm-5.2, which says two is still too few.
# Almost every gap in the numbers above is one finding wide. Re-run before trusting
# a one-item difference, and do not re-order this table on one.
# Chain order is measured recall, then cost, with claude last because it is the
# lead's vendor and gets skipped for anything the lead authored. codex stays first:
# it ties qwen and k3 within one finding and it is the only alternate that is both a
# different vendor AND a different runtime, which is worth more than the finding it
# costs given how much harness turned out to matter. visual_verify keeps a short
# chain because qwen, moonshot and deepseek declare no `vision` capability and
# [requires] filters them out anyway.
[fallbacks]
plan_review    = ["codex", "qwen", "moonshot", "deepseek", "claude"]
code_review    = ["codex", "qwen", "moonshot", "deepseek", "claude"]
visual_verify  = ["codex", "claude"]
verify         = ["codex", "qwen", "moonshot", "deepseek", "claude"]
judge          = ["codex", "qwen", "moonshot", "deepseek", "claude"]
council_member = ["codex", "qwen", "moonshot", "deepseek", "claude"]

# Role policy selects the model tier and reasoning effort. Provider defaults in
# the catalog cover the lead and anything a role leaves unset. Review and
# judgement run frontier; scoped implementation runs strong, which is cheaper and
# weaker by design. The tier names are vendor-neutral: which model each one means
# depends on the provider the chain lands on (on today's codex route, frontier is
# gpt-5.6-sol and strong is gpt-5.6-terra).
[role_tiers]
plan_review    = "frontier"
code_review    = "frontier"
small_impl     = "strong"
visual         = "frontier"
browser_test   = "frontier"
visual_verify  = "frontier"
verify         = "frontier"
judge          = "frontier"
council_member = "frontier"

# Effort is routed here, not inherited from whoever dispatches. OpenAI's GPT-5.6
# guidance is that medium is the balanced starting point and high or xhigh are
# justified only where evals show a meaningful gain, so a role earns high by
# adjudicating: plan_review, code_review, verify, judge and council_member decide
# whether work ships, and a miss there ships the defect. The medium rows are the
# ones with an argument behind them. small_impl is bounded work whose output the
# lead tests anyway, on the strong tier already. visual, browser_test and
# visual_verify are bounded by the browser driver and the evidence it captures,
# not by reasoning depth. xhigh appears nowhere on purpose: the 2026-08-05 audit
# measured practice at 6763 xhigh turns against 2298 high with no eval behind the
# gap. Raising any value here means beating that argument, in evals/.
[role_efforts]
plan_review    = "high"
code_review    = "high"
small_impl     = "medium"
visual         = "medium"
browser_test   = "medium"
visual_verify  = "medium"
verify         = "high"
judge          = "high"
council_member = "high"

# Independent roles must be resolved away from every artifact-author vendor.
# `--exclude-lead` remains a compatibility flag but does not satisfy this
# requirement because the catalog lead is not necessarily the artifact author.
[independence]
plan_review    = "author_vendor"
code_review    = "author_vendor"
visual_verify  = "author_vendor"
verify         = "author_vendor"
judge          = "all_author_vendors"

# Drivers gather evidence. They are not model providers and cannot satisfy a
# review role, vendor-independence claim, model tier, or ship floor.
[drivers.playwright]
binary       = "playwright-cli"
channel      = "playwright-cli"
capabilities = ["browser_driver"]
reference    = "references/providers/browser.md"

[role_drivers]
visual_verify = "playwright"

# --- Presets: how a delegate runs (resolve with `delegate-resolve --preset <name>`) ---
[presets.read_only]
sandbox  = "read-only"
approval = "never"
use      = "reviews & verification: the delegate looks and reports, it changes nothing"

[presets.build]
sandbox  = "workspace-write"
approval = "never"
worktree = "true"
use      = "small scoped impl; the lead runs the tests and integrates"

[presets.parallel]
sandbox  = "workspace-write"
approval = "never"
worktree = "true"
cap      = "3-5"
use      = "one worktree-isolated delegate per task; collect patches, integrate serially"

[presets.single_writer]
sandbox  = "workspace-write"
approval = "never"
worktree = "true"
use      = "delegates write only in worktrees or return patches; the lead owns integration and commits"
