# megapowers model catalog: what orchestrates, what models exist, what each is for.
# Last reviewed: 2026-08-10 (model IDs age; scripts/check-freshness.sh guards this date).
# Edit an OVERRIDE LAYER, not this shipped file: a project .megapowers/models.toml or
# user ~/.config/megapowers/models.toml wins per key and survives plugin updates.
# Two identical copies ship (plugins/megapowers/models.toml and
# plugins/mega-orchestration/models.toml) because plugins cannot locate each other
# at runtime; scripts/validate.sh fails on any drift between them.
# Consumers: the megapowers SessionStart hook renders this into every session's
# context (hooks/render-model-catalog), and mega-orchestration's delegate-resolve
# reads it for lead, tiers, providers, and floor.
# Routing (roles, fallbacks, presets) stays in the multi-agent-delegation skill's
# delegates.toml. A provider section written in a delegates.toml layer wins over
# this catalog, but the session block renders from catalog layers only, so put
# provider data here.
#
# One model per provider per tier. Anything else is an override layer's business.
#   claude-opus-5     frontier: lead at high effort, hard design calls
#   claude-sonnet-5   strong: in-session teammate work and cheap execution
#   gpt-5.6-sol       frontier: plan review, code review, verify, judge, research
#   gpt-5.6-terra     strong: scoped implementation
#   qwen3.8-max       frontier: third-vendor review and judgement
#   kimi-k3           frontier: fourth-vendor review and judgement
#   deepseek-v4-pro   frontier: cheap review screen
#   grok-4.5          strong: scoped implementation, volume execution

# --- Legacy lead fallback ---
# delegate-resolve --lead prints it. Artifact reviews use --author-vendor rather
# than assuming the lead authored the artifact.
[lead]
provider = "claude"
tier     = "frontier"

# --- Tiers: the vendor-neutral capability scale, weakest first ---
[tiers]
scale = ["strong", "frontier"]

# What each tier is for. The session-start block teaches this to every session,
# including native subagent model choice.
[tiers.use]
strong   = "teammate work and cheap execution; the ship floor"
frontier = "lead, critic, judge, verify, hard design calls"

# --- Efforts: the vendor-neutral spend scale, weakest first ---
# The floor's effort half (tier:effort) and each provider's default `effort`
# speak this scale; a provider's `efforts` array lists the subset it accepts.
[efforts]
scale = ["low", "medium", "high", "xhigh", "max", "ultra"]

# These strings render into every session, and the block is clamped to 1024 bytes
# by hooks/render-model-catalog, so each one pays rent twice: in the clamp and in
# a cached prefix that costs more to churn than to leave alone. The xhigh entry
# carries its bar inline because that is the only place a session reads it.
[efforts.use]
low    = "mechanical steps, relays, latency-sensitive work"
medium = "balanced default: in-session teammate work, and delegated roles bounded by something other than depth (scoped impl, visual, browser)"
high   = "lead default, and every role that adjudicates or refutes"
xhigh  = "eval-gated; audit found 3x high usage without evidence"
max    = "unconstrained; eval-gated, never default"
ultra  = "deliberate complex work; Codex only, via the complex profile"

# --- Runtime adapters and model providers ---
# An adapter is the HARNESS launch surface. A provider is the model/vendor identity
# used for tiers and independence. `binary` is the CLI delegate-resolve
# probes with `command -v`, and that CLI brings its own stored login: this catalog
# holds no endpoints, keys, or token names, and adding them is out of scope by
# design. A model reachable only by hand-wiring a base URL and a token is not
# reachable here. `reference` names the channel-mechanics file, resolved relative to
# the multi-agent-delegation skill directory (the reference files ship with that
# skill). `use` is shown in the session block. Stop-hook approval reads a current
# structured receipt, never a transcript marker. Older override layers without
# [adapters] remain provider-keyed for compatibility.
[adapters.claude]
binary = "claude"
channel = "claude-cli"
reference = "references/providers/claude.md"

[adapters.codex]
binary = "codex"
channel = "native-or-plugin-or-mcp-or-cli"
reference = "references/providers/codex.md"

[adapters.opencode]
binary = "opencode"
channel = "opencode-native"
reference = "references/providers/opencode.md"

[providers.claude]
effort  = "high"   # lead default; in-session teammate work runs medium
# `max` is deliberately absent, and it is the one effort here removed on external
# evidence rather than on a spend argument. Artificial Analysis's Coding Agent
# Index (v1.3, read 2026-08-09) measures Claude Code + Opus 5 at max scoring BELOW
# its own xhigh on four axes at once: composite 66 against 67, $8.95 against $8.23,
# 23.7 min against 23.6, and SWE-Atlas-QnA 49 against 55. A rung that costs more,
# takes longer, and answers worse than the rung beneath it is not an escalation,
# so nothing can route to it and no override layer should add it back without a
# newer measurement. This is a claim about Opus 5 specifically, not about `max` as
# a concept: codex keeps its own top rungs below because they still buy something.
efforts = ["low", "medium", "high", "xhigh"]
vendor  = "anthropic"
adapter = "claude"
binary  = "claude"
channel = "claude-cli"
default_tier = "frontier"
capabilities = ["code", "vision", "computer_use"]
reference = "references/providers/claude.md"
use     = "lead: orchestration, integration, in-session teammate work"
notes   = "The lead runs as the session itself; the headless channel is for a delegate pass under a different lead."

# Two models, two tiers; the role's tier picks which. Sonnet 5 carries the strong
# tier so "least capable model that can do the role" has somewhere cheaper to land:
# Anthropic's 2026-07-24 guidance puts Sonnet 5 paired with a frontier advisor
# within 10 percent of frontier quality at 63 percent of the price. That ratio is
# dated: Sonnet 5's introductory $2/$10 ends 2026-08-31 and lists at $3/$15 after,
# against Opus 5's unchanged $5/$25, so the gap narrows from roughly 40 to 60
# percent on 2026-09-01. The tier survives the change, the number does not; re-read
# it at the next freshness review rather than treating it as current. Effort is the
# other lever, and it crosses tiers: frontier at low effort can beat strong at
# high effort, so raise the tier before raising effort on hard work. Haiku is
# never routed.
[providers.claude.tiers]
frontier = "claude-opus-5"
strong   = "claude-sonnet-5"

# Second model vendor, so the cross-vendor roles have a real different-vendor route
# when the lead (or an --exclude) rules out the primary.
[providers.codex]
effort  = "high"   # default only where a role leaves effort unset; ultra is the complex profile only
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]  # max: model effort; ultra: complex profile
vendor  = "openai"
adapter = "codex"
binary  = "codex"
channel = "native-or-plugin-or-mcp-or-cli"
default_tier = "frontier"
capabilities = ["code", "vision", "computer_use"]
reference = "references/providers/codex.md"
use     = "critic: plan and code review, verify, judge, research, computer use, scoped impl"
notes   = "Native subagents inside Codex; codex-plugin-cc from Claude Code; codex exec / SDK / codex mcp-server elsewhere. Channel mechanics: see the reference file."
# Run sol on the codex channel and nowhere else. Driven through opencode instead it
# hung on three of four review runs, ~36 minutes each with a preamble and no findings,
# and the one run that completed scored 5 of 13 against the 12 it scores natively.
# This is the sharpest harness effect measured on 2026-08-09 and the reason the
# channel is pinned rather than left to whatever the caller has installed.

# sol reviews and researches; terra executes what the lead scoped for it.
# Terra is sol minus roughly one finding per review: on the 2026-08-09 fixtures below
# it scored 11 of 13 against sol's 12, missing the wrapped-error class (%v where %w
# was meant) that sol catches, at 2.4x sol's speed. Treat it as sol's fast fallback,
# not as a peer. gpt-5.6-luna scored 9 of 13 and is not routed.
[providers.codex.tiers]
frontier = "gpt-5.6-sol"
strong   = "gpt-5.6-terra"

# --- Third, fourth and fifth vendors, hosted by the opencode harness ---
# These earn rows under the same rule the delegates.toml fallbacks section states:
# a provider is a harness someone runs, not a model with an endpoint. The harness
# here is opencode, already an adapter above, holding its own stored login exactly
# like the claude and codex CLIs do. megapowers wires no base URL and no token for
# them; `opencode` is the binary probed and opencode owns the credential. A model
# these vendors publish that opencode cannot reach is not reachable here either.
#
# vendor is keyed to the model's actual maker, not to the harness, because vendor
# is what the independence roles resolve against. Routing anthropic-authored work
# to two opencode-hosted providers is two genuine second opinions; routing it to
# one "opencode" provider twice would not be.
#
# Evidence, 2026-08-09/10: fifteen models over two code-review fixtures carrying
# thirteen planted defects between them, same prompt, same diffs, plus three
# implementation tasks with hidden tests. Recall out of 13: claude-opus-5 13,
# qwen3.8-max 13, kimi-k3 13, deepseek-v4-pro 12, gpt-5.6-sol 12 (codex only),
# grok-4.5 11. The three implementation tasks saturated, every frontier model
# passed every hidden test including exactly-once-under-concurrency and crash-safe
# writes, so nothing here is an argument about writing code. It is an argument
# about review recall, which is the only thing that separated these models.
#
# HARNESS PINNING, and it does not generalise the way the codex row does. Running
# these four inside codex against OpenRouter works but measures worse: kimi-k3 fell
# 13 to 11, deepseek-v4-pro 12 to 9, qwen3.8-max held at 13 but took 2.6x longer.
# Only grok-4.5 gained, by one, which is inside the noise. A native harness helps
# the model it was co-trained with and hurts a third-party model pushed through a
# rival vendor's harness. Keep these on opencode.
#
# Effort is deliberately medium. Raising it bought nothing measurable: kimi-k3
# scored the same on default, xhigh and max, and the flag did not reach it at all
# below max. Roles that adjudicate still get high from delegates.toml [role_efforts].
[providers.qwen]
effort  = "medium"
efforts = ["low", "medium", "high"]
vendor  = "alibaba"
adapter = "opencode"
binary  = "opencode"
channel = "opencode-native"
default_tier = "frontier"
capabilities = ["code"]
reference = "references/providers/opencode.md"
use     = "third-vendor review"
notes   = "Highest-recall non-Anthropic route measured. Only the frontier tier is measured; no strong-tier claim is made."

[providers.qwen.tiers]
frontier = "qwen3.8-max"

[providers.moonshot]
effort  = "medium"
efforts = ["low", "medium", "high", "xhigh", "max"]
vendor  = "moonshot"
adapter = "opencode"
binary  = "opencode"
channel = "opencode-native"
default_tier = "frontier"
capabilities = ["code"]
reference = "references/providers/opencode.md"
use     = "fourth-vendor review"
notes   = "Ties opus on review recall. Consistently lists what it checked and cleared, which is what makes its misses cheap to audit."

# k2.7-code carries the strong tier on measurement, not on its name: it scored 10 of
# 13 against k3's 13, and produced a full review in 21s.
[providers.moonshot.tiers]
frontier = "kimi-k3"
strong   = "kimi-k2.7-code"

# enabled=false is a session-block budget decision, not a quality one: the rendered
# catalog is clamped to 1024 bytes and five providers with prose do not fit. deepseek
# and xai are cost optimisations rather than independence routes, so they are the two
# that wait. Set `enabled = true` in an override layer to route them; every tier,
# measurement and note they need is already here.
[providers.deepseek]
enabled = false
effort  = "medium"
efforts = ["low", "medium", "high"]
vendor  = "deepseek"
adapter = "opencode"
binary  = "opencode"
channel = "opencode-native"
default_tier = "frontier"
capabilities = ["code"]
reference = "references/providers/opencode.md"
use     = "cheap review screen"
notes   = "12 of 13 for under three cents across both fixtures. Cheap enough to stop being a delegation decision."

# flash is not a cheaper pro, it is a worse model at the same price: 9 of 13 against
# pro's 12, for 2.5 cents against 2.8. The tier split is real, the saving is not.
[providers.deepseek.tiers]
frontier = "deepseek-v4-pro"
strong   = "deepseek-v4-flash"

[providers.xai]
enabled = false
effort  = "medium"
efforts = ["low", "medium", "high", "xhigh"]
vendor  = "xai"
adapter = "opencode"
binary  = "opencode"
channel = "opencode-native"
default_tier = "strong"
capabilities = ["code"]
reference = "references/providers/opencode.md"
use     = "volume execution"
notes   = "Weakest reviewer of the routed set at 11 of 13, and the fastest writer: it cleared all three implementation fixtures in 6m05s for $0.61, against muse-1.2's 8m29s and $0.81. grok-build-0.1, the coding-specialist variant, scored 9 and is not routed."

[providers.xai.tiers]
strong = "grok-4.5"

# --- Defaults: cross-cutting rules ---
[defaults]
# Minimum tier:effort for anything that ships, on the global scales. A provider
# whose default_tier or declared default effort sits below the corresponding
# floor is skipped at resolution. Providers without an effort use the tier only.
# Wrapper agents relaying to an external CLI inherit the session model
# (`model: inherit`); relay fidelity is worth the spend.
floor = "strong:low"
