schema_version: "1.1"
name: launcher-error
tags: [smoke, positive]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 90
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Diagnose this failed model launch from its complete log. The parent session
    still works. Log: "no usable setup-token accounts: open runtime/state.lock:
    read-only file system". No request reached the provider. Return one JSON
    object with keys category and action. category must be one of filesystem,
    authentication, quota, or model. action must be one of repair-runtime-access,
    login, switch-model, or retry. Do not execute a repair or contact a provider.
graders:
  - name: filesystem-cause
    type: regex
    pattern: '"category"\s*:\s*"filesystem"'
  - name: scoped-repair
    type: regex
    pattern: '"action"\s*:\s*"repair-runtime-access"'
  - name: no-unsupported-diagnosis
    type: regex
    pattern: '"(?:authentication|quota|model|login|switch-model|retry)"'
    match: not_contains
  - name: debugging-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?systematic-debugging"'
