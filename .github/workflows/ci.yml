name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install deterministic test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck bubblewrap

      - name: Validate repository
        run: go run ./scripts/cmd/maintainer validate

      - name: Staticcheck (advisory)
        continue-on-error: true
        run: go run ./scripts/cmd/ci staticcheck

      - name: Run deterministic evals
        id: eval
        continue-on-error: true
        run: go run ./evals/cmd/evaltool run-all --json results.jsonl

      - name: Strict-score deterministic evals
        id: score
        if: always()
        continue-on-error: true
        run: go run evals/score.go --strict results.jsonl

      - name: Upload sanitized deterministic results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: deterministic-eval-results
          path: results.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Enforce deterministic eval gate
        if: always()
        env:
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: go run ./scripts/cmd/ci eval-gate

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.257
      - name: Validate Claude marketplace
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Validate sole Claude plugin
        run: claude plugin validate --strict plugins/megapowers

  codex-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned minimum Codex CLI
        run: npm install -g @openai/codex@0.152.0
      - name: Codex install smoke
        run: go run ./scripts/cmd/maintainer codex-install-smoke

  windows-hook-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - name: Assert run-hook.cmd exit codes through cmd.exe
        run: go run ./scripts/cmd/ci windows-hooks
