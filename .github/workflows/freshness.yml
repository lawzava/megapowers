name: freshness

# Current Claude Code and Codex support can drift without a repository change.
# Recheck dated support metadata weekly. Validate Claude packaging and the Codex
# install path against current stable CLIs nightly.

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday at 06:17 UTC
    - cron: '23 3 * * *' # nightly, 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - name: Harness support reviewed within 30 days
        run: go run ./scripts/cmd/check-freshness

  latest-install-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install current stable CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          npm install -g @openai/codex@latest
      - name: Validate Claude marketplace
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Validate sole Claude plugin
        run: claude plugin validate --strict plugins/megapowers
      - name: Codex install smoke on current stable
        run: go run ./scripts/cmd/maintainer codex-install-smoke
