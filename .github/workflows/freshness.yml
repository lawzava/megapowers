name: freshness

# Current Claude Code and Codex support plus pinned validation tooling can drift
# without a repository change. Recheck those dated surfaces every week.

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Harness support reviewed within 30 days
        run: scripts/check-freshness.sh
