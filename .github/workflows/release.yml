name: release-attestation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attest (required for manual re-runs)'
        required: true
        type: string
      expected_sha:
        description: 'Commit SHA the tag must point to (derived from the tag when empty)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false

      - name: Verify signatures and assert tag target
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: go run ./scripts/cmd/ci release-verify

      - name: Extract manifest versions
        id: versions
        run: go run ./scripts/cmd/ci manifest-versions

      - name: Install deterministic test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck bubblewrap

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install pinned harness CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.257
          npm install -g @openai/codex@0.152.0

      - name: Validate repository
        run: go run ./scripts/cmd/maintainer validate

      - name: Claude install smoke on the exact published tag
        env:
          HARNESS: claude
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.versions.outputs.claude }}
        run: go run ./scripts/cmd/ci release-smoke

      - name: Codex install smoke
        env:
          HARNESS: codex
        run: go run ./scripts/cmd/ci release-smoke

      - name: Hash plugin tree and reject symlinks
        id: tree
        run: go run ./scripts/cmd/ci plugin-tree

      - name: Emit attestation
        env:
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          CLAUDE_VERSION: ${{ steps.versions.outputs.claude }}
          CODEX_VERSION: ${{ steps.versions.outputs.codex }}
          PLUGIN_TREE_SHA256: ${{ steps.tree.outputs.tree }}
          MODES_MANIFEST_SHA256: ${{ steps.tree.outputs.modes }}
          SMOKE_CLAUDE: ${{ env.SMOKE_CLAUDE }}
          SMOKE_CODEX: ${{ env.SMOKE_CODEX }}
        run: go run ./scripts/cmd/ci attestation

      - name: Upload release attestation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-attestation
          path: attestation.json
          if-no-files-found: error
          retention-days: 14

  publish-release-branch:
    # Installs track the release branch, which only ever fast-forwards to an
    # attested tag. A failed attestation therefore never reaches installs.
    needs: attest
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - name: Fast-forward release to the attested tag
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./scripts/cmd/ci release-fast-forward
