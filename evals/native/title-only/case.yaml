schema_version: "1.1"
name: title-only
tags: [smoke, negative]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 60
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Return only this JSON object: {"title":"Fix retry timeout"}.
    This is a title formatting request. Do not inspect files or invoke tools.
graders:
  - name: exact-result
    type: regex
    pattern: '^\s*\{\s*"title"\s*:\s*"Fix retry timeout"\s*\}\s*$'
  - name: no-skill
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: no-read
    type: tool_used
    tool: Read
    min: 0
    max: 0
  - name: no-glob
    type: tool_used
    tool: Glob
    min: 0
    max: 0
  - name: no-grep
    type: tool_used
    tool: Grep
    min: 0
    max: 0
